<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub HTML Viewer</title>
    <!-- Google Fonts para uma tipografia limpa estilo YouTube -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💵</text></svg>"><!DOCTYPE html>
    
    <style>
        /* Variáveis de Cores - Padrão YouTube Dark */
        :root {
            --bg-main: #0f0f0f;
            --bg-card: #1f1f1f;
            --bg-card-hover: #2f2f2f;
            --text-main: #f1f1f1;
            --text-secondary: #aaa;
            --accent-color: #ff0000; /* Vermelho YouTube para detalhes se necessário */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 2rem;
            text-align: left;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Grid Responsivo estilo YouTube */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 1200px;
        }

        /* Card estilo YouTube (sem imagem, focado no link) */
        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: background-color 0.2s ease, transform 0.2s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* "Thumbnail" artificial para manter o formato do YouTube */
        .card-thumbnail {
            background: linear-gradient(135deg, #2c3e50, #000000);
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            font-weight: bold;
            font-size: 1.2rem;
        }

        .card-info {
            padding: 0.75rem;
            display: flex;
            gap: 0.75rem;
        }

        /* Avatar fictício do canal para imitar o layout */
        .card-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .card-text {
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.2rem;
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-metadata {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Hover Effects */
        .card-link:hover .card {
            background-color: var(--bg-card-hover);
        }

        /* Estado de carregamento ou erro */
        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        /* Ajustes para telas maiores (Desktop de alta resolução) */
        @media (min-width: 900px) {
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1.25rem;
            }
            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="repo-title">Carregando Repositório...</h1>
        <p id="repo-path">Buscando arquivos HTML...</p>
    </header>

    <main class="video-grid" id="grid-container">
        <div class="status-message">Carregando conteúdo do GitHub...</div>
    </main>

    <script>
        // CONFIGURAÇÃO: Altere os valores abaixo para apontar para o seu repositório
        const CONFIG = {
            username: "espaso",       // Usuário ou Organização do GitHub
            repo: "estudo",              // Nome do repositório
            folderPath: "estrategia"              // Deixe vazio "" para a raiz ou mude para "nome-da-pasta" se os HTMLs estiverem submersos
        };

        // Renderiza as URLs das páginas (Usa o GitHub Pages se estiver ativo, ou o raw se não estiver)
        // Se você usa o GitHub Pages, a URL ideal seria: `https://${CONFIG.username}.github.io/${CONFIG.repo}/${file.path}`
        function getPageUrl(file) {
			return `https://${CONFIG.username}.github.io/${CONFIG.repo}/${file.path}`;
            //return `https://htmlpreview.github.io/?https://github.com/${CONFIG.username}/${CONFIG.repo}/blob/main/${file.path}`;
        }

        async function fetchGithubFiles() {
            const gridContainer = document.getElementById('grid-container');
            const repoTitle = document.getElementById('repo-title');
            const repoPath = document.getElementById('repo-path');

            // Monta a URL da API do GitHub para listar o conteúdo do diretório
            const apiUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folderPath}`;

            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`Erro na API do GitHub: ${response.status}`);
                }

                const data = await response.json();
                
                // Filtra apenas os arquivos que terminam com a extensão .html
                const htmlFiles = data.filter(file => file.type === 'file' && file.name.endsWith('.html'));

                // Atualiza o cabeçalho
                repoTitle.textContent = CONFIG.repo;
                repoPath.textContent = `Exibindo arquivos HTML encontrados em: /${CONFIG.folderPath}`;

                if (htmlFiles.length === 0) {
                    gridContainer.innerHTML = `<div class="status-message">Nenhum arquivo .html encontrado neste diretório.</div>`;
                    return;
                }

                // Limpa o container de carregamento
                gridContainer.innerHTML = '';

                // Cria os cards dinamicamente
                htmlFiles.forEach(file => {
                    const cleanName = file.name.replace('.html', '').replace(/[-_]/g, ' ');
                    const targetUrl = getPageUrl(file);

                    const cardHTML = `
                        <a href="${targetUrl}" target="_blank" class="card-link">
                            <div class="card">
                                <div class="card-thumbnail">
                                    &lt;/HTML&gt;
                                </div>
                                <div class="card-info">
                                    <div class="card-avatar">Git</div>
                                    <div class="card-text">
                                        <div class="card-title" title="${file.name}">${cleanName}</div>
                                        <div class="card-metadata">Arquivo • HTML5</div>
                                        <div class="card-metadata">${(file.size / 1024).toFixed(1)} KB</div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    `;
                    gridContainer.insertAdjacentHTML('beforeend', cardHTML);
                });

            } catch (error) {
                console.error(error);
                gridContainer.innerHTML = `
                    <div class="status-message">
                        <p>Não foi possível carregar os arquivos.</p>
                        <small style="color: #ff4444;">${error.message}</small>
                    </div>
                `;
            }
        }

        // Executa a função ao carregar a página
        fetchGithubFiles();
    </script>
</body>
</html>
