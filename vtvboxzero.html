<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos de Estratégias - Google Drive</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
    
    <style>
        /* Variáveis de Cores - Padrão YouTube Dark */
        :root {
            --bg-main: #0f0f0f;
            --bg-card: #1f1f1f;
            --bg-card-hover: #2f2f2f;
            --bg-sidebar: #0f0f0f;
            --bg-sidebar-hover: #272727;
            --bg-sidebar-active: #383838;
            --text-main: #f1f1f1;
            --text-secondary: #aaa;
            --accent-color: #ff0000;
            --header-height: 56px;
            --sidebar-width: 240px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Header estilo YouTube */
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background-color: var(--bg-main);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
            border-bottom: 1px solid #272727;
        }

        .menu-toggle {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            margin-right: 16px;
        }

        .menu-toggle:hover {
            background-color: #272727;
        }

        .menu-toggle svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
        }

        /* Layout Container */
        .layout-container {
            display: flex;
            margin-top: var(--header-height);
            min-height: calc(100vh - var(--header-height));
            position: relative;
        }

        /* Sidebar Retrátil estilo YouTube */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            height: calc(100vh - var(--header-height));
            position: fixed;
            top: var(--header-height);
            left: 0;
            overflow-y: auto;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 90;
            padding: 12px 8px;
            border-right: 1px solid #272727;
        }

        body.sidebar-collapsed .sidebar {
            transform: translateX(-100%);
        }

        .sidebar-section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 8px 12px;
            letter-spacing: 0.5px;
        }

        .folder-menu-list {
            list-style: none;
            margin-bottom: 16px;
        }

        .folder-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 400;
            transition: background-color 0.15s;
            user-select: none;
        }

        .folder-item:hover {
            background-color: var(--bg-sidebar-hover);
        }

        .folder-item.active {
            background-color: var(--bg-sidebar-active);
            font-weight: 500;
        }

        .folder-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .folder-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: var(--header-height);
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 85;
        }

        /* Conteúdo Principal */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 2rem 1.5rem;
            transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 100%;
        }

        body.sidebar-collapsed .main-content {
            margin-left: 0;
        }

        header.page-header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            text-align: left;
        }

        header.page-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        header.page-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Grid Responsivo */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Card estilo YouTube */
        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            transition: background-color 0.2s ease, transform 0.2s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .card-thumbnail {
            background: #000;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            padding: 0.75rem;
            display: flex;
            gap: 0.75rem;
        }

        .card-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
            color: #fff;
        }

        .card-text {
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.2rem;
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-metadata {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .card-link:hover .card {
            background-color: var(--bg-card-hover);
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            body:not(.sidebar-collapsed) .sidebar {
                transform: translateX(0);
            }
            body:not(.sidebar-collapsed) .sidebar-overlay {
                display: block;
            }
            .main-content {
                margin-left: 0 !important;
                padding: 1.5rem 1rem;
            }
        }

        @media (min-width: 900px) {
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1.25rem;
            }
            header.page-header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="top-header">
        <button class="menu-toggle" id="menu-toggle-btn" title="Alternar menu">
            <svg viewBox="0 0 24 24">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
        </button>
        <a href="#" class="app-logo">
            <span>🎬</span>
            <span>Drive Tube - vtvboxzero</span>
        </a>
    </div>

    <div class="layout-container">
        
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section-title">Minhas Pastas</div>
            <ul class="folder-menu-list" id="folder-menu-list"></ul>
        </aside>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <main class="main-content">
            <header class="page-header">
                <h1 id="folder-title">Galeria de Vídeos</h1>
                <p id="folder-path">Selecione uma pasta no menu para carregar os vídeos...</p>
            </header>

            <section class="video-grid" id="grid-container">
                <div class="status-message">Aguardando seleção de pasta...</div>
            </section>
        </main>
    </div>

    <script>
        const CONFIG = {
            apiKey: "AIzaSyAEc8rACsKgkatu6m_mE9jpCg_TQ-G9nb4", // Insira sua API Key do Google Cloud
            
            // Adicione suas pastas do Drive aqui
            folders: [
                { name: "20260525", id: "19FZ5YwU6gLugdS3r7p0CLy-YOozQB1lG" },
                { name: "20260608", id: "1xOKQ0-EOQMynk3VwLbsNKn1h3Z88ECmA" },
                { name: "20260615", id: "1OPRbBAT_RA9Fpj-vp2E3m5_Utdzbh0o6" },
                { name: "20260620", id: "1l19hyfNhzOSjKRaUDZf4UKB-8bfasvdQ" },
                { name: "20260706", id: "1Ft3Ejifv4Kg_2gXNJcm63R2USaR8Lj4Y" },
                { name: "REVISAO", id: "1Fx2cU4xVnTDgHEXsqt6HHSf_lPzaud-k" }
            ]
        };

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return 'Tamanho desconhecido';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // Converte a URL padrão do Drive (/view) para a URL de reprodução direta (/preview) ou constrói via ID
        function getPreviewUrl(file) {
            if (file.webViewLink) {
                return file.webViewLink.replace(/\/view(\?.*)?$/, '/preview');
            }
            return `https://drive.google.com/file/d/${file.id}/preview`;
        }

        function renderSidebarMenu() {
            const menuList = document.getElementById('folder-menu-list');
            menuList.innerHTML = '';

            CONFIG.folders.forEach((folder, index) => {
                const li = document.createElement('li');
                li.className = 'folder-item' + (index === 0 ? ' active' : '');

                li.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                    </svg>
                    <span class="folder-name">${folder.name}</span>
                `;

                li.addEventListener('click', () => {
                    document.querySelectorAll('.folder-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    loadFolder(folder.id, folder.name);

                    if (window.innerWidth <= 768) {
                        document.body.classList.add('sidebar-collapsed');
                    }
                });

                menuList.appendChild(li);
            });

            if (CONFIG.folders.length > 0) {
                loadFolder(CONFIG.folders[0].id, CONFIG.folders[0].name);
            }
        }

        async function loadFolder(folderId, folderName) {
            const gridContainer = document.getElementById('grid-container');
            const folderTitle = document.getElementById('folder-title');
            const folderPath = document.getElementById('folder-path');

            folderTitle.textContent = folderName;
            folderPath.textContent = `Buscando vídeos na pasta ID: ${folderId}...`;
            gridContainer.innerHTML = `<div class="status-message">Carregando vídeos de "${folderName}"...</div>`;

            const query = `'${folderId}' in parents and mimeType contains 'video/' and trashed = false`;
            const fields = "files(id, name, thumbnailLink, webViewLink, size)";
            const apiUrl = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=${encodeURIComponent(fields)}&key=${CONFIG.apiKey}`;

            try {
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error ? errorData.error.message : `Erro HTTP: ${response.status}`);
                }

                const data = await response.json();
                const videoFiles = data.files || [];

                folderPath.textContent = `Exibindo ${videoFiles.length} vídeo(s) encontrado(s) em "${folderName}".`;

                if (videoFiles.length === 0) {
                    gridContainer.innerHTML = `<div class="status-message">Nenhum vídeo encontrado nesta pasta.</div>`;
                    return;
                }

                gridContainer.innerHTML = '';

                videoFiles.forEach(file => {
                    const thumbnailUrl = file.thumbnailLink 
                        ? file.thumbnailLink.replace(/=s\d+/, '=w320-h180-p') 
                        : '';
                    
                    // Gera o link alterado para /preview
                    const targetUrl = getPreviewUrl(file);

                    const cardHTML = `
                        <a href="${targetUrl}" target="_blank" class="card-link">
                            <div class="card">
                                <div class="card-thumbnail">
                                    ${thumbnailUrl 
                                        ? `<img src="${thumbnailUrl}" alt="${file.name}" loading="lazy" onerror="this.parentElement.innerHTML='🎬';">` 
                                        : '🎬'}
                                </div>
                                <div class="card-info">
                                    <div class="card-avatar">PLAY</div>
                                    <div class="card-text">
                                        <div class="card-title" title="${file.name}">${file.name}</div>
                                        <div class="card-metadata">Vídeo • Google Drive</div>
                                        <div class="card-metadata">${formatBytes(file.size)}</div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    `;
                    gridContainer.insertAdjacentHTML('beforeend', cardHTML);
                });

            } catch (error) {
                console.error(error);
                gridContainer.innerHTML = `
                    <div class="status-message">
                        <p>Não foi possível carregar os vídeos do Google Drive.</p>
                        <small style="color: #ff4444;">${error.message}</small>
                    </div>
                `;
            }
        }

        document.getElementById('menu-toggle-btn').addEventListener('click', () => {
            document.body.classList.toggle('sidebar-collapsed');
        });

        document.getElementById('sidebar-overlay').addEventListener('click', () => {
            document.body.classList.add('sidebar-collapsed');
        });

        window.addEventListener('DOMContentLoaded', renderSidebarMenu);
    </script>
</body>
</html>
