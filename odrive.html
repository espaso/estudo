<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lista de Vídeos OneDrive</title>
</head>
<body>
<h2>Vídeos da pasta OneDrive</h2>
<div id="videos"></div>

<script>
async function listarVideos() {
    try {
        // Token gerado a partir do link de compartilhamento
        // Exemplo: link = "https://1drv.ms/f/s!XXXX"
        // Converter para Base64 URL-safe e prefixar com "u!"
        const sharingToken = "u!7ABCE8B7826547EF";

        const resp = await fetch(`https://graph.microsoft.com/v1.0/shares/${sharingToken}/driveItem/children`);
        if (!resp.ok) throw new Error("Erro ao buscar lista");

        const data = await resp.json();
        const container = document.getElementById("videos");

        data.value
            .filter(item => item.file && item.file.mimeType.startsWith("video/"))
            .forEach(video => {
                const vid = document.createElement("video");
                vid.src = video["@microsoft.graph.downloadUrl"];
                vid.controls = true;
                vid.width = 480;
                container.appendChild(vid);
                container.appendChild(document.createElement("br"));
            });

    } catch (err) {
        console.error(err);
    }
}

listarVideos();


function gerarSharingToken(link) {
    // Codifica em Base64
    let base64 = btoa(link);
    // Torna URL-safe
    base64 = base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    // Prefixa com "u!"
    return "u!" + base64;
}

// Exemplo de uso:
const link = "https://1drv.ms/f/c/7ABCE8B7826547EF/IgCE9bxbh4ccSolcIz4bOTnfATox_XIeewWWn0IY5J5KSW4";
console.log(gerarSharingToken(link));

</script>
</body>
</html>
